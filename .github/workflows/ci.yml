name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependency
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Compile validation scripts
        run: python -m compileall -q scripts
      - name: Validate suites and run records
        run: python scripts/validate_repo.py
      - name: Reproduce stored metric fix
        run: python scripts/verify_fix.py
