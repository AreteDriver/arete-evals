name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependency
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile validation scripts
        run: python -m compileall -q arete_evals scripts tests
      - name: Lint and formatting
        run: |
          ruff format --check arete_evals tests scripts
          ruff check arete_evals tests scripts
      - name: Validate suites and run records
        run: python scripts/validate_repo.py
      - name: Reproduce stored metric fix
        run: python scripts/verify_fix.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical replay bundle
        run: |
          python -m arete_evals.cli run \
            --suite suites/structured-response-integrity.yaml \
            --out /tmp/arete-evals-runs \
            --bundle-id ci-replay \
            --created-at 2026-08-31T12:00:00+00:00
          python -c "import json; from pathlib import Path; p=Path('/tmp/arete-evals-runs/ci-replay/manifest.json'); m=json.loads(p.read_text()); assert m['verdict']=='pass' and not m['outputs_truncated']"
